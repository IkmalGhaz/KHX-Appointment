<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHS Clinic - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background: #f0f2f5;
        }

        .mobile-frame {
            width: 100%;
            max-width: 375px;
            height: 812px;
            background: #f8fafc;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .mobile-frame {
                border-radius: 40px;
                border: 8px solid #1a1a1a;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                height: 812px;
                margin-top: 2rem;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            gap: 1rem;
            padding-bottom: 0.5rem;
        }

        .scroll-item {
            scroll-snap-align: start;
            flex-shrink: 0;
            width: 160px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">
    <div id="profile-view-modal"
        class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[90%] flex flex-col overflow-hidden animate-slide-up">
            <div class="px-6 pt-8 pb-4 flex justify-between items-center border-b border-gray-50">
                <h2 class="text-xl font-bold text-gray-900">Personal Information</h2>
                <button onclick="closeViewProfile()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"
                        class="w-5 h-5 text-gray-600"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6">
                <div class="bg-teal-50 border border-teal-100 rounded-3xl p-5 flex items-center gap-4">
                    <div
                        class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-[#009688] shadow-sm">
                        <i data-lucide="clock" class="w-6 h-6"></i></div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Member since</p>
                        <h4 id="view-member-since" class="text-base font-bold text-gray-800 leading-tight">Loading...
                        </h4>
                        <p id="view-days-count" class="text-xs font-bold text-[#009688]">-- days with us</p>
                    </div>
                </div>

                <div class="flex flex-col items-center gap-3">
                    <img id="view-prof-img" src="assets/js/images/default-user.png"
                        class="w-24 h-24 rounded-full object-cover border-4 border-teal-50 shadow-md">
                    <h3 id="view-full-name-header" class="text-lg font-bold text-gray-800">User Name</h3>
                </div>
                <div class="space-y-4">
                    <div class="space-y-1"><label class="text-xs font-bold text-gray-400 uppercase ml-1">Full
                            Name</label>
                        <div class="flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3.5"><span
                                id="view-full-name">--</span></div>
                    </div>
                    
                    <div class="space-y-1"><label class="text-xs font-bold text-gray-400 uppercase ml-1">Phone
                            Number</label>
                        <div class="flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3.5"><span
                                id="view-phone">--</span></div>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-700 ml-1">Email</label>
                    <div class="flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3.5">
                        <i data-lucide="mail" class="w-5 h-5 text-gray-400"></i>
                        <span id="view-email" class="text-gray-600">--</span>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-700 ml-1">Date of Birth</label>
                    <div class="flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3.5">
                        <i data-lucide="calendar" class="w-5 h-5 text-gray-400"></i>
                        <span id="view-dob" class="text-gray-600">--</span>
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-700 ml-1">Address</label>
                    <div class="flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3.5">
                        <i data-lucide="map-pin" class="w-5 h-5 text-gray-400"></i>
                        <span id="view-address" class="text-gray-600">--</span>
                    </div>
                </div>
                
                <div class="pt-4 space-y-3">
                    <button id="open-edit-btn"
                        class="w-full bg-[#009688] text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Edit
                        Profile</button>
                    <button id="profile-logout-btn"
                        class="w-full py-4 bg-red-50 text-red-600 font-bold rounded-2xl active:scale-95 transition-all">Logout
                        Account</button>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-edit-modal"
        class="absolute inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[90%] flex flex-col overflow-hidden animate-slide-up">
            <div class="px-6 pt-8 pb-4 flex justify-between items-center border-b border-gray-50">
                <h2 class="text-xl font-bold text-gray-900">Edit Profile</h2>
                <button onclick="closeEditProfile()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"
                        class="w-5 h-5 text-gray-600"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6">
                <form id="edit-profile-form" class="space-y-4">
                    <div class="flex flex-col items-center gap-3">
                        <div class="relative w-24 h-24">
                            <img id="edit-prof-img-preview" src="assets/js/images/default-user.png"
                                class="w-full h-full rounded-full object-cover border-4 border-teal-50">
                            <label for="img-upload"
                                class="absolute bottom-0 right-0 bg-[#009688] p-2 rounded-full text-white cursor-pointer shadow-lg"><i
                                    data-lucide="camera" class="w-4 h-4"></i></label>
                            <input type="file" id="img-upload" class="hidden" accept="image/*">
                        </div>
                    </div>
                    <div class="space-y-1"><label class="text-xs font-bold text-gray-400 uppercase ml-1">Full
                            Name</label><input type="text" id="edit-prof-name"
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm font-semibold outline-none focus:ring-2 focus:ring-[#009688]">
                    </div>
                    <div class="space-y-1"><label class="text-xs font-bold text-gray-400 uppercase ml-1">Phone
                            Number</label><input type="tel" id="edit-prof-phone"
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm font-semibold outline-none focus:ring-2 focus:ring-[#009688]">
                    </div>
                    <div class="space-y-1"><label class="text-xs font-bold text-gray-400 uppercase ml-1">Mailing
                            Address</label><textarea id="edit-prof-address" rows="3"
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm font-semibold outline-none focus:ring-2 focus:ring-[#009688] resize-none"></textarea>
                    </div>
                    <button type="submit" id="save-edit-btn"
                        class="w-full bg-[#009688] text-white font-bold py-4 rounded-2xl shadow-lg mt-4">Save
                        Changes</button>
                </form>
            </div>
        </div>
    </div>

    <div id="doctor-popup"
        class="absolute inset-0 bg-black/50 backdrop-blur-sm z-[70] hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[80%] flex flex-col overflow-hidden animate-slide-up">
            <div class="px-6 pt-8 pb-4 flex justify-between items-center border-b border-gray-50">
                <h2 class="text-xl font-bold text-gray-900">Our Specialists</h2>
                <button onclick="closeDoctorPopup()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"
                        class="w-5 h-5 text-gray-600"></i></button>
            </div>
            <div id="doctor-popup-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        </div>
    </div>

    <div class="mobile-frame">
        <div class="bg-[#009688] pt-12 pb-16 px-6 relative shrink-0 rounded-b-[2.5rem] shadow-lg z-10">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-teal-50 text-xs font-bold uppercase tracking-wider mb-1" id="date-display">Today</p>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Welcome</h1>
                </div>
                <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm border-2 border-white/30 flex items-center justify-center text-white cursor-pointer"
                    id="logout-btn"><i data-lucide="user" class="w-5 h-5"></i></div>
            </div>
            <div class="text-center">
                <h2 class="text-xl font-bold text-white tracking-tight uppercase">KHS Clinic</h2>
                <p class="text-teal-50 text-sm font-medium" id="user-name">Loading...</p>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-6 -mt-10 pb-6 relative z-20 space-y-5">
            <div class="pt-4 px-1">
                <div class="scroll-container no-scrollbar gap-4 pb-4">
                    <div class="scroll-item bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all"
                        onclick="window.location.href='health.html'">
                        <i data-lucide="activity" class="w-12 h-12 bg-blue-50 text-blue-500 p-3 rounded-full mb-3"></i>
                        <p class="text-[10px] font-bold text-gray-400 uppercase">My Health</p>
                        <div class="text-center mt-1">
                            <p id="dash-height" class="text-xs font-bold text-gray-700">-- cm</p>
                            <p id="dash-weight" class="text-xs font-bold text-gray-700">-- kg</p>
                        </div>
                    </div>
                    <div class="scroll-item bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all" onclick="window.location.href='mood.html'">
    <div id="dash-mood-ring-container" class="w-16 h-16 rounded-full flex items-center justify-center mb-2 relative" 
         style="background: conic-gradient(#22c55e 0%, #f3f4f6 0%);">
        <div class="absolute inset-0 m-1.5 bg-white rounded-full flex flex-col items-center justify-center">
            <span id="dash-mood-val" class="text-lg font-black text-gray-800 leading-none">--</span>
            <span class="text-[8px] text-gray-400 font-bold uppercase">mood</span>
        </div>
    </div>
    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">My Mood</p>
    <p id="dash-mood-status" class="text-xs font-bold text-gray-700">Today</p>
</div>
                    <div class="scroll-item bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all"
                        onclick="openDoctorPopup()">
                        <i data-lucide="stethoscope"
                            class="w-12 h-12 bg-teal-50 text-[#009688] p-3 rounded-full mb-3"></i>
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Expert Doctors</p>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="window.location.href='booking.html'"
                    class="w-full bg-[#009688] text-white p-4 rounded-2xl flex items-center justify-between shadow-lg">
                    <div class="flex items-center gap-4"><i data-lucide="calendar-plus" class="w-6 h-6"></i>
                        <div class="text-left">
                            <p class="font-bold">Book</p>
                            <p class="text-teal-50 text-xs">New Appointment</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-white/70"></i>
                </button>
                <button id="view-apt-btn"
                    class="w-full bg-white text-gray-800 p-4 rounded-2xl border border-gray-100 flex items-center justify-between">
                    <div class="flex items-center gap-4"><i data-lucide="calendar-check"
                            class="w-6 h-6 text-gray-600"></i>
                        <div class="text-left">
                            <p class="font-bold">View</p>
                            <p class="text-gray-400 text-xs">My History</p>
                        </div>
                    </div>
                </button>
                <button onclick="window.location.href='feedback.html'"
                    class="w-full bg-white text-gray-800 p-4 rounded-2xl border border-gray-100 flex items-center justify-between">
                    <div class="flex items-center gap-4"><i data-lucide="star" class="w-6 h-6 text-gray-600"></i>
                        <div class="text-left">
                            <p class="font-bold">Feedback</p>
                            <p class="text-gray-400 text-xs">& Rating</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                </button>
            </div>

            <div class="pt-4 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-5 rounded-[2rem] text-white">
                        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Weekly</p>
                        <h4 class="text-2xl font-bold" id="weekly-count">24</h4>
                    </div>
                    <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-5 rounded-[2rem] text-white">
                        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Monthly</p>
                        <h4 class="text-2xl font-bold" id="monthly-count">142</h4>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                    <h4 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users"
                            class="w-4 h-4 text-blue-500"></i> Patient Age Analysis</h4>
                    <div class="h-[200px] w-full"><canvas id="ageAnalysisChart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="apt-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
            <div class="bg-white rounded-t-[2.5rem] h-[85%] flex flex-col overflow-hidden animate-slide-up">
                <div class="px-6 pt-8 pb-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-900">My Appointments</h2>
                    <button id="close-modal" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"
                            class="w-5 h-5 text-gray-600"></i></button>
                </div>
                <div class="flex px-6 border-b border-gray-50">
                    <button onclick="switchTab('Upcoming')"
                        class="tab-btn flex-1 py-3 text-sm font-bold border-b-2 border-[#009688] text-[#009688]">Upcoming</button>
                    <button onclick="switchTab('Past')"
                        class="tab-btn flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400">Past</button>
                    <button onclick="switchTab('Cancelled')"
                        class="tab-btn flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400">Cancelled</button>
                </div>
                <div id="appointments-list" class="flex-1 overflow-y-auto no-scrollbar p-6 bg-gray-50/50"></div>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/dashboard.js"></script>
    <script type="module" src="assets/js/view-appointments.js"></script>
</body>

</html>
