<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f0f2f5; }
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: #f8fafc; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glassmorphism for the top cards */
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        
        <div class="bg-[#009688] pt-12 pb-16 px-6 relative shrink-0 rounded-b-[2.5rem] shadow-lg z-10">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-teal-50 text-xs font-bold uppercase tracking-wider mb-1" id="date-display">Today</p>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Welcome</h1>
                </div>
                
                <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm border-2 border-white/30 flex items-center justify-center text-white cursor-pointer" id="logout-btn">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="text-center">
                <div class="w-20 h-20 bg-white rounded-full mx-auto flex items-center justify-center shadow-lg mb-3 text-[#009688]">
                    <i data-lucide="heart-pulse" class="w-10 h-10"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-tight">KHX CLINIC</h2>
                <p class="text-teal-50 text-sm font-medium" id="user-name">Loading Patient...</p>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-6 -mt-10 pb-6 relative z-20 space-y-5">

            <div class="grid grid-cols-2 gap-4">
                <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center min-h-[140px]">
                    <div class="relative w-16 h-16 mb-2">
                         <canvas id="miniChart"></canvas>
                    </div>
                    <p class="text-xs font-bold text-gray-500 uppercase">My Health</p>
                    <p class="text-sm font-bold text-gray-800">Status</p>
                </div>

                <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center min-h-[140px]" onclick="alert('Feature coming soon!')">
                    <div class="w-12 h-12 bg-teal-50 rounded-full flex items-center justify-center text-[#009688] mb-2">
                        <i data-lucide="stethoscope" class="w-6 h-6"></i>
                    </div>
                    <p class="text-xs font-bold text-gray-500 uppercase">Expert</p>
                    <p class="text-sm font-bold text-gray-800">Doctors</p>
                </div>
            </div>

            <div class="space-y-3">
                
                <button onclick="window.location.href='booking.html'" 
                        class="w-full bg-white text-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 
                               active:scale-95 active:bg-[#009688] active:text-white active:border-[#009688] 
                               transition-all flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-100 p-2 rounded-lg text-gray-600 group-active:bg-white/20 group-active:text-white transition-colors">
                            <i data-lucide="calendar-plus" class="w-6 h-6"></i>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-lg leading-tight">Book</p>
                            <p class="text-gray-400 text-xs group-active:text-teal-50 transition-colors">New Appointment</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 group-active:text-white transition-colors"></i>
                </button>

                <button id="view-apt-btn" 
                        class="w-full bg-white text-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 
                               active:scale-95 active:bg-[#009688] active:text-white active:border-[#009688] 
                               transition-all flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-100 p-2 rounded-lg text-gray-600 group-active:bg-white/20 group-active:text-white transition-colors">
                            <i data-lucide="calendar-check" class="w-6 h-6"></i>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-lg leading-tight">View</p>
                            <p class="text-gray-400 text-xs group-active:text-teal-50 transition-colors">My History</p>
                        </div>
                    </div>
                    <div id="badge-count" class="hidden bg-teal-100 text-[#009688] text-xs font-bold px-2 py-1 rounded-full group-active:bg-white group-active:text-[#009688]">0</div>
                </button>

                <button onclick="window.location.href='feedback.html'" 
                        class="w-full bg-white text-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 
                               active:scale-95 active:bg-[#009688] active:text-white active:border-[#009688] 
                               transition-all flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-100 p-2 rounded-lg text-gray-600 group-active:bg-white/20 group-active:text-white transition-colors">
                            <i data-lucide="star" class="w-6 h-6"></i>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-lg leading-tight">Feedback</p>
                            <p class="text-gray-400 text-xs group-active:text-teal-50 transition-colors">& Rating</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 group-active:text-white transition-colors"></i>
                </button>

            </div>

            <div class="text-center pt-4">
                <h3 class="font-bold text-gray-900">Our Clinic at Glance</h3>
                <p class="text-xs text-gray-400 mt-1">Trusted by thousands of patients</p>
            </div>

        </div>

        <div id="apt-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
            <div class="bg-white rounded-t-[2rem] p-6 h-[70%] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-900">My Appointments</h2>
                    <button id="close-modal" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200">
                        <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                    </button>
                </div>
                <div id="appointments-list" class="overflow-y-auto no-scrollbar space-y-3 flex-1 pb-4">
                </div>
            </div>
        </div>

    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
