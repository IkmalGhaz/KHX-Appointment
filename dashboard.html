<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-slate-800 flex justify-center items-center min-h-screen p-0 md:p-4">

    <div class="w-full h-screen md:w-[375px] md:h-[812px] bg-gray-50 md:rounded-[2.5rem] overflow-hidden md:border-[8px] md:border-gray-900 relative shadow-2xl flex flex-col ring-1 ring-black/5">

        <div class="bg-red-600 p-6 pt-12 pb-8 rounded-b-[2rem] shadow-lg relative z-10 shrink-0">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">KHX Clinic</h1>
                    <p class="text-red-100 text-xs font-medium opacity-90 mt-1">Patient Dashboard</p>
                </div>
                <button id="logout-btn" class="bg-white/20 hover:bg-white/30 p-2 rounded-full backdrop-blur-sm transition text-white">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="mt-6 flex items-center gap-3 bg-white/10 p-3 rounded-xl backdrop-blur-md border border-white/10">
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-red-600 font-bold shadow-sm">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
                <div class="overflow-hidden">
                    <p class="text-xs text-red-100 uppercase tracking-wider font-bold">Welcome</p>
                    <p id="user-email" class="text-sm font-semibold text-white truncate">Loading...</p>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6">

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 rounded-lg bg-red-100 flex items-center justify-center text-red-600">
                        <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                    </div>
                    <h2 class="font-bold text-gray-900">Book Appointment</h2>
                </div>

                <form id="booking-form" class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Date</label>
                        <input type="date" id="app-date" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Time</label>
                        <input type="time" id="app-time" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-red-500 outline-none">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Reason</label>
                        <textarea id="app-reason" rows="2" placeholder="e.g. Fever, Checkup" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-red-500 outline-none resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-gray-200 active:scale-95 transition-all flex justify-center gap-2 mt-2">
                        Confirm Booking
                    </button>
                </form>
            </div>

            <div>
                <h3 class="font-bold text-gray-900 mb-3 ml-1 flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i> Upcoming Visits
                </h3>
                
                <div id="appointments-list" class="space-y-3 pb-8">
                    <div class="text-center py-8 text-gray-400 text-sm">Loading records...</div>
                </div>
            </div>

        </div>
    </div>

    <script>lucide.createIcons();</script>

    <script type="module">
        import { auth, db, signOut, onAuthStateChanged, collection, addDoc, query, where, getDocs } from './assets/js/firebase-config.js';

        // DOM Elements
        const userEmailSpan = document.getElementById('user-email');
        const logoutBtn = document.getElementById('logout-btn');
        const bookingForm = document.getElementById('booking-form');
        const appointmentsList = document.getElementById('appointments-list');
        let currentUser = null;

        // 1. AUTH GUARD
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                userEmailSpan.innerText = user.email;
                await loadAppointments(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        // 2. LOGOUT
        logoutBtn.addEventListener('click', async () => {
            if(confirm("Are you sure you want to logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });

        // 3. BOOK APPOINTMENT
        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            const btn = bookingForm.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Booking...";
            btn.disabled = true;
            btn.classList.add('opacity-75');

            try {
                const date = document.getElementById('app-date').value;
                const time = document.getElementById('app-time').value;
                const reason = document.getElementById('app-reason').value;

                await addDoc(collection(db, "appointments"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    date: date,
                    time: time,
                    reason: reason,
                    status: "pending",
                    createdAt: new Date()
                });

                // Reset Form
                bookingForm.reset();
                alert("Appointment booked successfully!");
                await loadAppointments(currentUser.uid); // Refresh list

            } catch (error) {
                console.error("Booking Error:", error);
                alert("Failed to book appointment.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });

        // 4. LOAD APPOINTMENTS (Styled for Mobile)
        async function loadAppointments(userId) {
            try {
                const q = query(collection(db, "appointments"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);
                
                appointmentsList.innerHTML = "";

                if (querySnapshot.empty) {
                    appointmentsList.innerHTML = `
                        <div class="text-center py-8 border-2 border-dashed border-gray-200 rounded-xl">
                            <p class="text-gray-400 text-sm">No appointments found.</p>
                        </div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Status Color Logic
                    let statusColor = "bg-yellow-100 text-yellow-700";
                    if(data.status === 'confirmed') statusColor = "bg-green-100 text-green-700";
                    if(data.status === 'cancelled') statusColor = "bg-red-100 text-red-700";

                    const item = document.createElement('div');
                    item.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";
                    item.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-bold px-2 py-0.5 rounded-md ${statusColor} uppercase tracking-wide">${data.status}</span>
                                <span class="text-xs text-gray-400">${data.date}</span>
                            </div>
                            <div class="font-bold text-gray-800 text-lg">${data.time}</div>
                            <div class="text-sm text-gray-500 font-medium">${data.reason}</div>
                        </div>
                        <div class="h-10 w-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-400">
                             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </div>
                    `;
                    appointmentsList.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                appointmentsList.innerHTML = "<p class='text-red-500 text-center text-sm'>Error loading data.</p>";
            }
        }
    </script>
</body>
</html>
