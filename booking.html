<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book Appointment</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; -webkit-tap-highlight-color: transparent; }
        
        /* Mobile Frame (Matches Dashboard) */
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: #fafafa; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth Fade In */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* FLATPICKR TEAL THEME OVERRIDE */
    .flatpickr-day.selected, 
    .flatpickr-day.startRange, 
    .flatpickr-day.endRange, 
    .flatpickr-day.selected.inRange, 
    .flatpickr-day.startRange.inRange, 
    .flatpickr-day.endRange.inRange, 
    .flatpickr-day.selected:focus, 
    .flatpickr-day.startRange:focus, 
    .flatpickr-day.endRange:focus, 
    .flatpickr-day.selected:hover, 
    .flatpickr-day.startRange:hover, 
    .flatpickr-day.endRange:hover, 
    .flatpickr-day.selected.prevMonthDay, 
    .flatpickr-day.startRange.prevMonthDay, 
    .flatpickr-day.endRange.prevMonthDay, 
    .flatpickr-day.selected.nextMonthDay, 
    .flatpickr-day.startRange.nextMonthDay, 
    .flatpickr-day.endRange.nextMonthDay {
        background: #009688 !important;
        border-color: #009688 !important;
    }
    
    .flatpickr-day.today {
        border-color: #009688 !important;
    }
    .flatpickr-day.today:hover {
        background: #e0f2f1 !important;
        color: #009688 !important;
    }

    /* Loading Spinner Animation */
    .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #009688;
        width: 24px;
        height: 24px;
        -webkit-animation: spin 1s linear infinite; /* Safari */
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        
        <div class="bg-white px-6 pt-8 pb-4 sticky top-0 z-20">
            <div class="flex items-center justify-between mb-6">
                <button onclick="window.handleBack()" class="p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Step <span id="step-lbl">1</span> of 3</span>
            </div>
            
            <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden mb-5">
                <div id="progress-bar" class="h-full bg-[#009688] w-[33%] transition-all duration-500"></div>
            </div>

            <h1 id="page-title" class="text-2xl font-bold text-[#004d40]">Choose a Service</h1>
            <p id="page-subtitle" class="text-sm text-gray-500 mt-1">Select the type of care you need</p>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-8 bg-[#fafafa]">
            
            <form id="bookingForm" class="space-y-6">

                <div id="step-1" class="step-content fade-in">
                    
                    <div id="service-list" class="space-y-4 pt-2">
                        <div class="animate-pulse bg-white p-5 rounded-2xl h-24 border border-gray-100"></div>
                        <div class="animate-pulse bg-white p-5 rounded-2xl h-24 border border-gray-100"></div>
                    </div>
                </div>

                <div id="step-2" class="step-content hidden fade-in">
                    <div id="doctor-list" class="space-y-4"></div>
                </div>

               <div id="step-3" class="step-content hidden fade-in">
    <div class="relative mb-6">
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
            <i data-lucide="calendar" class="w-6 h-6 text-[#009688]"></i>
        </div>
        <input type="text" id="date-picker" 
               class="w-full bg-white text-gray-800 font-bold text-lg border-2 border-gray-100 rounded-2xl py-4 pl-12 pr-4 shadow-sm focus:outline-none focus:border-[#009688] focus:ring-4 focus:ring-teal-50 transition-all cursor-pointer placeholder-gray-400" 
               placeholder="Select Date" readonly>
        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
            <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
        </div>
    </div>

    <h3 class="font-bold text-gray-800 mb-4 px-1">Available Slots</h3>
    <div id="time-slots" class="grid grid-cols-2 gap-3">
        <p class="text-gray-400 text-sm italic col-span-2">Select a date above to see times.</p>
    </div>
</div>

                <div id="step-4" class="step-content hidden fade-in">
    <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm mb-4">
        <h3 class="font-bold text-[#004d40] text-lg mb-4">Summary</h3>
        <div class="space-y-3">
            <div class="flex justify-between text-sm">
                <span class="text-gray-500">Service</span>
                <span class="font-bold text-gray-800" id="pay-service">--</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-500">Doctor</span>
                <span class="font-bold text-gray-800" id="pay-doctor">--</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-500">Date</span>
                <span class="font-bold text-gray-800" id="pay-date">--</span>
            </div>
        </div>
    </div>

    <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm mb-6">
        <div class="flex justify-between items-center mb-4">
            <span class="text-gray-500">Total Amount</span>
            <span class="text-2xl font-bold text-[#009688]" id="pay-price">RM 0</span>
        </div>
        <p class="text-xs text-gray-400 border-t pt-3">*Full payment required to confirm.</p>
    </div>

    <h3 class="font-bold text-gray-800 mb-3 px-1">Payment Method</h3>
    <div class="flex gap-2 mb-8">
        <button type="button" onclick="selectPayment('card')" id="btn-card" class="pay-btn flex-1 py-3 border border-[#009688] bg-[#e0f2f1] text-[#009688] rounded-xl text-sm font-bold">Card</button>
        <button type="button" onclick="selectPayment('fpx')" id="btn-fpx" class="pay-btn flex-1 py-3 border border-gray-200 bg-white text-gray-500 rounded-xl text-sm font-bold">FPX</button>
        <button type="button" onclick="selectPayment('wallet')" id="btn-wallet" class="pay-btn flex-1 py-3 border border-gray-200 bg-white text-gray-500 rounded-xl text-sm font-bold">E-Wallet</button>
    </div>

    <button type="button" onclick="processPayment()" id="pay-btn-main" class="w-full bg-[#009688] text-white font-bold py-4 rounded-2xl shadow-lg shadow-teal-200 active:scale-95 transition-all">
        Pay Now
    </button>
</div>

<div id="step-5" class="step-content hidden fade-in text-center pt-10">
    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600 animate-bounce">
        <i data-lucide="check" class="w-12 h-12"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Payment Successful!</h2>
    <p class="text-gray-500 mb-8 px-4">Your appointment is confirmed.</p>
    
    <a href="dashboard.html" class="block w-full bg-[#009688] text-white font-bold py-4 rounded-2xl shadow-lg shadow-teal-200 active:scale-95 transition-all">
        Back to Dashboard
    </a>
</div>

            </form>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="assets/js/booking.js"></script>
</body>
</html>
