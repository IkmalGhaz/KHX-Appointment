<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="max-width: 800px; margin-top: 2rem;">
        <div class="card">
            <div class="wizard-progress">
                <div class="step-indicator active" id="ind-1">1</div>
                <div class="step-indicator" id="ind-2">2</div>
                <div class="step-indicator" id="ind-3">3</div>
                <div class="step-indicator" id="ind-4">4</div>
            </div>

            <form id="bookingForm">
                <div id="step-1" class="wizard-step">
                    <h2>Select Service</h2>
                    <p class="text-light">What type of care do you need?</p>
                    <div id="service-list" class="selection-grid" style="margin-top: 1rem;">
                        </div>
                </div>

                <div id="step-2" class="wizard-step hidden">
                    <h2>Select Doctor</h2>
                    <p class="text-light">Choose a specialist</p>
                    <div id="doctor-list" class="selection-grid" style="margin-top: 1rem;"></div>
                    <button type="button" class="btn btn-outline" onclick="prevStep(1)" style="margin-top: 1rem;">Back</button>
                </div>

                <div id="step-3" class="wizard-step hidden">
                    <h2>Date & Time</h2>
                    <div class="form-group">
                        <label>Select Date</label>
                        <input type="date" id="date-picker" class="form-control" style="width: 100%; padding: 10px;">
                    </div>
                    <label>Available Slots</label>
                    <div id="time-slots" class="time-grid"></div>
                    <button type="button" class="btn btn-outline" onclick="prevStep(2)" style="margin-top: 1rem;">Back</button>
                </div>

                <div id="step-4" class="wizard-step hidden">
                    <div style="text-align: center;">
                        <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: var(--primary-color);"></i>
                        <h2 style="margin: 1rem 0;">Booking Confirmed!</h2>
                        <p>Your appointment has been scheduled.</p>
                        <a href="dashboard.html" class="btn btn-primary" style="margin-top: 2rem;">Back to Dashboard</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="assets/js/booking.js"></script>
    <script>
        // Global helpers for inline onclicks (bridging module scope)
        window.prevStep = (step) => document.dispatchEvent(new CustomEvent('prevStep', { detail: step }));
    </script>
</body>
</html>
