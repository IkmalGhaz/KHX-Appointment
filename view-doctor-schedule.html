<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-frame { 
            width: 100%; 
            max-width: 375px; 
            min-height: 812px; 
            background: #f8fafc; 
            margin: 0 auto; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        @media (min-width: 768px) { 
            .mobile-frame { 
                border-radius: 40px; 
                border: 8px solid #1a1a1a; 
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
                height: 812px; 
                margin-top: 2rem; 
                overflow-y: auto; 
                background: #f8fafc;
            } 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-200">

    <div class="mobile-frame relative">
        
        <div class="px-6 pt-10 pb-4 sticky top-0 bg-[#f8fafc] z-20">
            <div class="flex items-center gap-3 mb-5">
                <a href="doctor-dashboard.html" class="p-1 -ml-1 text-gray-800 hover:bg-gray-200 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
                <h1 class="text-2xl font-bold text-gray-900">Schedule</h1>
            </div>

            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Type here ..." 
                    class="w-full bg-[#EAEAEA] border-none rounded-xl py-3 pl-12 pr-4 text-sm font-medium text-gray-700 outline-none focus:ring-2 focus:ring-gray-300 transition-all placeholder-gray-400">
            </div>
        </div>

        <div id="apt-list" class="flex-1 overflow-y-auto no-scrollbar px-6 pb-24 space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm animate-pulse h-32"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm animate-pulse h-32"></div>
        </div>
        
        <div id="action-sheet" class="absolute inset-0 bg-black/50 z-50 hidden flex flex-col justify-end fade-in">
            <div class="bg-white rounded-t-3xl p-6">
                <h3 class="font-bold text-lg mb-4 text-gray-800" id="sheet-title">Manage Appointment</h3>
                <div class="space-y-3">
                    <button id="btn-cancel" class="w-full py-4 bg-red-50 text-red-600 font-bold rounded-xl">Cancel Appointment</button>
                    <button onclick="closeActionSheet()" class="w-full py-4 text-gray-500 font-bold">Close</button>
                </div>
            </div>
        </div>

    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="assets/js/view-doctor-schedule.js"></script>
</body>
</html>
