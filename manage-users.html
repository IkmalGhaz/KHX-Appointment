<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHX Clinic - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .badge-active { background: #ecfdf5; color: #10b981; }
        .badge-pending { background: #fff7ed; color: #f59e0b; }
        .badge-role { background: #eff6ff; color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <button onclick="location.href='admin-dashboard.html'" class="p-2 hover:bg-gray-200 rounded-full transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-800">User Management</h1>
                </div>
                <p class="text-gray-500 text-sm pl-10">Manage roles and verify accounts for clinic staff and patients.</p>
            </div>
            <button onclick="alert('Add User feature coming soon!')" class="bg-[#3b82f6] text-white px-5 py-2.5 rounded-lg font-semibold flex items-center gap-2 shadow-sm hover:bg-blue-600 transition-all">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Add New User
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-gray-400"></i>
                <input type="text" id="user-search" placeholder="Search by name or email..." 
                       class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm">
            </div>
            <div id="filter-container" class="flex gap-2 w-full md:w-auto overflow-x-auto no-scrollbar pb-1">
                <button data-filter="All" class="filter-chip active bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-100 transition-colors">All</button>
                <button data-filter="Pending" class="filter-chip bg-gray-50 text-gray-500 px-4 py-1.5 rounded-full text-xs font-bold border border-gray-100 hover:bg-gray-100 transition-colors">Pending</button>
                <button data-filter="Staff" class="filter-chip bg-gray-50 text-gray-500 px-4 py-1.5 rounded-full text-xs font-bold border border-gray-100 hover:bg-gray-100 transition-colors">Staff</button>
                <button data-filter="Doctor" class="filter-chip bg-gray-50 text-gray-500 px-4 py-1.5 rounded-full text-xs font-bold border border-gray-100 hover:bg-gray-100 transition-colors">Doctors</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden min-h-[300px]">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-4 text-[11px] font-bold text-gray-400 uppercase">User Info</th>
                            <th class="px-6 py-4 text-[11px] font-bold text-gray-400 uppercase">Role</th>
                            <th class="px-6 py-4 text-[11px] font-bold text-gray-400 uppercase">Status</th>
                            <th class="px-6 py-4 text-[11px] font-bold text-gray-400 uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-gray-50">
                        </tbody>
                </table>
            </div>
            <div id="loading-state" class="py-12 text-center text-gray-400 flex flex-col items-center">
                <div class="animate-spin w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full mb-2"></div>
                <p class="text-sm">Loading users from database...</p>
            </div>
        </div>
    </div>

    <div id="action-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden animate-[scale_0.2s_ease-out]">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Actions for <span id="modal-user-name" class="text-blue-600">User</span></h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-2 space-y-1">
                <button data-action="Verify" class="action-btn w-full flex items-center gap-3 px-4 py-3 hover:bg-gray-50 rounded-xl transition-colors text-sm font-medium">
                    <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i> Activate Account
                </button>
                <button data-action="Staff" class="action-btn w-full flex items-center gap-3 px-4 py-3 hover:bg-gray-50 rounded-xl transition-colors text-sm font-medium">
                    <i data-lucide="briefcase" class="w-5 h-5 text-blue-500"></i> Promote to Staff
                </button>
                <button data-action="Doctor" class="action-btn w-full flex items-center gap-3 px-4 py-3 hover:bg-gray-50 rounded-xl transition-colors text-sm font-medium">
                    <i data-lucide="stethoscope" class="w-5 h-5 text-cyan-500"></i> Promote to Doctor
                </button>
                <div class="h-px bg-gray-100 my-2"></div>
                <button data-action="Delete" class="action-btn w-full flex items-center gap-3 px-4 py-3 hover:bg-red-50 rounded-xl transition-colors text-sm font-medium text-red-600">
                    <i data-lucide="trash-2" class="w-5 h-5"></i> Delete User
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/manage-users.js"></script>
</body>
</html>
