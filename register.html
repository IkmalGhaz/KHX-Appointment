<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f0f2f5; }
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: white; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }
        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        <div class="bg-white p-6 border-b border-gray-100 flex items-center gap-3 sticky top-0 z-20">
            <a href="index.html" class="p-2 -ml-2 rounded-full hover:bg-gray-50 text-gray-600">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h1 class="text-xl font-bold text-gray-900">New Account</h1>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-6">
            <form id="reg-form" class="space-y-4 pb-8">
                
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase ml-1">Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Ali Bin Abu" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Email</label>
                        <input type="email" id="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Phone</label>
                        <input type="tel" id="phone" placeholder="011-xxxxxxx" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Gender</label>
                        <select id="gender" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase ml-1">Birth Date</label>
                        <input type="date" id="dob" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase ml-1">Mailing Address</label>
                    <textarea id="address" rows="2" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase ml-1">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-200 active:scale-95 transition-all mt-4">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, setDoc, doc } from './assets/js/firebase-config.js';

        const regForm = document.getElementById('reg-form');
        const submitBtn = document.getElementById('submit-btn');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Creating Profile...";
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            try {
                // 1. Get Values
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const fullName = document.getElementById('fullName').value;
                const phone = document.getElementById('phone').value;
                const gender = document.getElementById('gender').value;
                const dobInput = document.getElementById('dob').value; // YYYY-MM-DD
                const address = document.getElementById('address').value;

                // Format DOB to DD/MM/YYYY (Based on your screenshot)
                const [year, month, day] = dobInput.split('-');
                const formattedDOB = `${day}/${month}/${year}`;

                // 2. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Save to Firestore (MATCHING YOUR SCHEMA)
                await setDoc(doc(db, "Users", user.uid), {
                    userId: "U" + Math.floor(1000 + Math.random() * 9000), // Random ID like "U1029"
                    firebaseUid: user.uid,
                    fullName: fullName,
                    email: email,
                    phone: phone,
                    gender: gender,
                    dateOfBirth: formattedDOB,
                    mailingAddress: address,
                    role: "Patient",
                    status: "Active",
                    profilePictureUrl: "", // Empty for now
                    createdAt: new Date()
                });

                alert("Account created successfully!");
                window.location.href = "dashboard.html";

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
