<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f0f2f5; }
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: white; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        <div class="bg-[#009688] h-64 flex flex-col items-center justify-center relative shrink-0">
            
            <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-4 shadow-lg overflow-hidden p-2">
                <img src="assets/js/images/logo.png" alt="Logo" class="w-full h-full object-contain">
            </div>

            <h1 class="text-3xl font-bold text-white tracking-tight">KHS Clinic</h1>
            <p class="text-teal-100 text-sm mt-1 font-medium opacity-90">Clinic Portal</p>
        </div>

        <div class="flex-1 bg-white -mt-8 rounded-t-[2rem] relative z-10 px-8 pt-10 pb-6 flex flex-col">
            <h2 class="text-2xl font-bold text-[#004d40] mb-6">Welcome Back</h2>

            <form id="login-form" class="space-y-5">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="email" id="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-[#009688] transition-all">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="password" id="password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-12 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-[#009688] transition-all">
                        
                        <button type="button" id="toggle-password" class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 focus:outline-none">
                            <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <p id="error-msg" class="text-xs font-bold text-red-500 text-center min-h-[20px]"></p>

                <button type="submit" id="submit-btn" class="w-full bg-[#009688] hover:bg-[#00796b] text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-200 active:scale-95 transition-all flex justify-center items-center gap-2">
                    Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-auto pt-6 text-center">
                <p class="text-sm font-medium text-gray-500">
                    New Patient? <a href="register.html" class="text-[#009688] font-bold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { auth, db, signInWithEmailAndPassword, onAuthStateChanged, doc, getDoc } from './assets/js/firebase-config.js';

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        // 1. Password Visibility Toggle Logic
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // 2. Updated Role-Based Redirect Function
        async function checkRoleAndRedirect(user) {
            try {
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === "admin") {
                        window.location.href = "admin-dashboard.html"; // Redirects admins
                    } else if (userData.role === "Doctor") { 
                        window.location.href = "doctor-dashboard.html"; // Redirects doctors
                    } else if (userData.role === "Staff" || userData.role === "staff") {
                        window.location.href = "staff-dashboard.html"; // New: Redirects staff members to the staff dashboard
                    } else {
                        window.location.href = "dashboard.html"; // Default for patients
                    }
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                console.error("Error checking user role:", error);
                window.location.href = "dashboard.html";
            }
        }

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                checkRoleAndRedirect(user);
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            submitBtn.innerText = "Verifying...";
            submitBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password); // Authenticates with Firebase
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Invalid email or password.";
                submitBtn.innerText = "Sign In";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
