<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KHS Clinic Appointment</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #eef2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't widen element */
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #007bff; /* Medical Blue */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>KHS Clinic Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="patient@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            <p id="errorMessage" class="error-msg"></p>
        </form>
    </div>

    <script type="module">
        // Import from your config file
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './firebase.config.js';

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        // 1. Check if user is ALREADY logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User already logged in:", user.email);
                // Redirect to dashboard if already logged in
                // window.location.href = "dashboard.html"; 
                errorMsg.style.color = "green";
                errorMsg.style.display = "block";
                errorMsg.innerText = "Already logged in as: " + user.email;
            }
        });

        // 2. Handle Login Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset error
            errorMsg.style.display = 'none';
            loginBtn.innerText = "Signing in...";
            loginBtn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Success
                console.log("Login Successful:", user);
                alert("Login Successful! Welcome " + user.email);
                
                // Redirect to dashboard (Create this file later)
                // window.location.href = "dashboard.html"; 

            } catch (error) {
                console.error("Login Error:", error.code, error.message);
                
                // Show error to user
                errorMsg.style.display = 'block';
                errorMsg.style.color = 'red';
                
                if (error.code === 'auth/user-not-found') {
                    errorMsg.innerText = "No user found with this email.";
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg.innerText = "Incorrect password.";
                } else {
                    errorMsg.innerText = "Error: " + error.message;
                }
            } finally {
                loginBtn.innerText = "Sign In";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
