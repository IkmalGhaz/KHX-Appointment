<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-slate-800 flex justify-center items-center min-h-screen p-0 md:p-4">

    <div class="w-full h-screen md:w-[375px] md:h-[812px] bg-white md:rounded-[2.5rem] overflow-hidden md:border-[8px] md:border-gray-900 relative shadow-2xl flex flex-col ring-1 ring-black/5">

        <div class="h-64 bg-red-600 relative flex items-center justify-center overflow-hidden shrink-0">
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 2px, transparent 2px); background-size: 24px 24px;"></div>
            
            <div class="relative z-10 text-center p-6">
                <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-white/30 shadow-lg">
                    <i data-lucide="plus" class="w-10 h-10 text-white font-bold"></i>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">KHX Clinic</h1>
                <p class="text-red-100 text-sm mt-1 font-medium">Your Health, Our Priority</p>
            </div>
        </div>

        <div class="flex-1 -mt-8 bg-white rounded-t-[2rem] relative z-20 px-8 pt-10 pb-6 flex flex-col overflow-y-auto no-scrollbar">
            
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Patient Login</h2>
                <p class="text-gray-500 text-sm mt-1">Sign in to book appointments</p>
            </div>

            <form id="login-form" class="space-y-5 flex-1">
                
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="email" id="email" placeholder="patient@example.com" required 
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all placeholder:font-normal">
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="password" id="password" placeholder="••••••••" required 
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all placeholder:font-normal">
                    </div>
                </div>

                <p id="error-msg" class="text-xs font-bold text-red-600 text-center min-h-[20px] mt-2"></p>

                <button type="submit" id="submit-btn" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-200 active:scale-95 hover:bg-red-700 transition-all flex justify-center items-center gap-2 mt-4">
                    <span>Sign In</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>

            </form>

            <div class="mt-auto pt-6 text-center border-t border-gray-100">
                <p class="text-sm font-medium text-gray-500">
                    New Patient? 
                    <button id="toggle-btn" class="text-red-600 font-bold hover:underline transition">Create Account</button>
                </p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        // Importing correctly from your assets folder
        import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, db, setDoc, doc } from './assets/js/firebase-config.js';

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('span');
        const toggleBtn = document.getElementById('toggle-btn');
        
        let isLoginMode = true;

        // 1. Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // 2. Toggle Login / Signup (Optional feature since you had it in original file)
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            if(isLoginMode) {
                document.querySelector('h2').innerText = "Patient Login";
                btnText.innerText = "Sign In";
                toggleBtn.innerText = "Create Account";
                errorMsg.innerText = "";
            } else {
                document.querySelector('h2').innerText = "Register Patient";
                btnText.innerText = "Sign Up";
                toggleBtn.innerText = "Back to Login";
                errorMsg.innerText = "";
            }
        });

        // 3. Handle Form Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            // UI Loading State
            submitBtn.disabled = true;
            btnText.innerText = "Processing...";
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            errorMsg.innerText = "";

            try {
                if (isLoginMode) {
                    // LOGIN
                    await signInWithEmailAndPassword(auth, email, password);
                    btnText.innerText = "Success!";
                } else {
                    // REGISTER
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Create minimal user doc
                    await setDoc(doc(db, "Users", user.uid), {
                        email: email,
                        role: "patient",
                        createdAt: new Date()
                    });
                    
                    alert("Account created! Redirecting...");
                    // Redirect happens automatically via onAuthStateChanged
                }
            } catch (error) {
                console.error("Auth Error:", error);
                
                // Reset Button
                submitBtn.disabled = false;
                btnText.innerText = isLoginMode ? "Sign In" : "Sign Up";
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');

                // Error Messages
                if (error.code === 'auth/email-already-in-use') errorMsg.innerText = "Email already registered.";
                else if (error.code === 'auth/invalid-credential') errorMsg.innerText = "Invalid email or password.";
                else if (error.code === 'auth/weak-password') errorMsg.innerText = "Password should be at least 6 chars.";
                else errorMsg.innerText = error.message;
            }
        });
    </script>
</body>
</html>
