<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f0f2f5; }
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: white; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        <div class="bg-red-600 h-64 flex flex-col items-center justify-center relative shrink-0">
            <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mb-4 border-2 border-white/30 shadow-lg">
                <i data-lucide="plus" class="w-10 h-10 text-white font-bold"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">KHX Clinic</h1>
            <p class="text-red-100 text-sm mt-1 font-medium opacity-90">Patient Portal</p>
        </div>

        <div class="flex-1 bg-white -mt-8 rounded-t-[2rem] relative z-10 px-8 pt-10 pb-6 flex flex-col">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Welcome Back</h2>

            <form id="login-form" class="space-y-5">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="email" id="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-red-500 transition-all">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                        <input type="password" id="password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-12 pr-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-red-500 transition-all">
                    </div>
                </div>

                <p id="error-msg" class="text-xs font-bold text-red-600 text-center min-h-[20px]"></p>

                <button type="submit" id="submit-btn" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-200 active:scale-95 transition-all flex justify-center items-center gap-2">
                    Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-auto pt-6 text-center">
                <p class="text-sm font-medium text-gray-500">
                    New Patient? <a href="register.html" class="text-red-600 font-bold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './assets/js/firebase-config.js';

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "dashboard.html";
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.innerText = "Verifying...";
            submitBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Invalid email or password.";
                submitBtn.innerText = "Sign In";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
