<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHX Clinic - Master Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f8; overflow: hidden; }
        .glass-sidebar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-right: 1px solid rgba(226, 232, 240, 0.8); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #ecfeff; color: #0891b2; border-right: 3px solid #0891b2; }
        .status-badge { font-size: 10px; font-bold; padding: 2px 8px; rounded: 6px; text-transform: uppercase; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen w-full text-slate-800">

    <aside class="w-[280px] glass-sidebar h-full flex flex-col shrink-0 z-50">
        <div class="h-24 flex items-center gap-3 px-8 border-b border-slate-100">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-cyan-200">
                <i data-lucide="activity" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight text-slate-900">KHX Clinic</h1>
                <p class="text-[10px] font-bold text-cyan-600 uppercase tracking-widest">Admin Suite</p>
            </div>
        </div>
        <nav class="flex-1 py-8 flex flex-col gap-1">
            <p class="px-8 text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Main Menu</p>
            <a href="admin-dashboard.html" class="nav-item flex items-center gap-4 px-8 py-4 text-sm font-semibold text-slate-600 hover:text-cyan-700">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="manage-users.html" class="nav-item flex items-center gap-4 px-8 py-4 text-sm font-semibold text-slate-600 hover:text-cyan-700">
                <i data-lucide="users" class="w-5 h-5"></i> Patient Records
            </a>
            <a href="manage-appointments.html" class="nav-item active flex items-center gap-4 px-8 py-4 text-sm font-semibold text-slate-600">
                <i data-lucide="calendar-range" class="w-5 h-5"></i> Master Schedule
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-24 px-10 flex items-center justify-between bg-[#f0f4f8]/80 backdrop-blur-sm z-40 sticky top-0">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Master Appointment Schedule</h2>
                <p class="text-sm text-slate-500">View and update appointment statuses for all doctors.</p>
            </div>
        </header>

        <div class="flex-1 px-10 pb-8 overflow-hidden flex flex-col">
            <div class="mb-6 flex gap-4">
                <div class="relative flex-1 max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="apt-search" placeholder="Search by Doctor or Patient..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-cyan-100">
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex-1 overflow-hidden flex flex-col">
                <div class="overflow-auto custom-scroll flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Appointment</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Patient</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Doctor</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-wider text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointment-table-body" class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="assets/js/manage-appointments.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
