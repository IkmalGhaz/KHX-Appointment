<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHX Clinic - Manage Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f0f2f5; }
        .mobile-frame { width: 100%; max-width: 375px; height: 812px; background: #f8fafc; margin: 0 auto; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .mobile-frame { border-radius: 40px; border: 8px solid #1a1a1a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); height: 812px; margin-top: 2rem; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.95); pointer-events: none; }
        .modal-active { opacity: 1; transform: scale(1); pointer-events: auto; }
        .transition-modal { transition: all 0.2s ease-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-frame">
        
        <div class="bg-gradient-to-r from-[#009688] to-[#00796b] pt-8 pb-6 px-6 relative shrink-0 rounded-b-[2.5rem] shadow-lg z-10">
            
            <div class="flex justify-between items-center mb-6">
                <div onclick="window.history.back()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white cursor-pointer active:scale-95 transition-all hover:bg-white/30">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </div>

                <div onclick="handleLogout()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white cursor-pointer active:scale-95 transition-all hover:bg-white/30">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </div>
            </div>

            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">My Schedule</h1>
                <p class="text-teal-50 text-sm font-medium opacity-90" id="doctor-name">Dr. Loading...</p>
            </div>
            
            <div class="flex items-center gap-2 mt-4 bg-white/10 p-2 rounded-lg backdrop-blur-sm border border-white/10">
                <div class="w-2 h-2 rounded-full bg-white"></div>
                <p class="text-[10px] text-white font-medium">Available</p>
                <div class="w-2 h-2 rounded-full bg-red-400 ml-2"></div>
                <p class="text-[10px] text-white font-medium">Unavailable</p>
                <p class="ml-auto text-[10px] text-teal-50 opacity-80 italic">Tap to change</p>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-5 -mt-4 pb-6 relative z-20 pt-4" id="calendar-container">
            </div>

        <div id="confirm-modal" class="absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm modal-enter transition-modal">
            <div class="bg-white w-[85%] rounded-2xl p-6 shadow-2xl transform transition-all">
                <div class="w-12 h-12 bg-teal-50 rounded-full flex items-center justify-center mb-4 mx-auto">
                    <i data-lucide="calendar-clock" class="w-6 h-6 text-[#009688]"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-900 text-center mb-2" id="modal-title">Confirm Action</h3>
                <p class="text-sm text-gray-500 text-center mb-6" id="modal-desc">
                    Are you sure you want to change this date?
                </p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="closeModal()" class="py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">
                        Cancel
                    </button>
                    <button id="confirm-btn" class="py-3 rounded-xl font-bold text-white bg-[#009688] hover:bg-[#00796b] shadow-lg shadow-teal-200 transition-colors">
                        Confirm
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium opacity-0 transition-opacity pointer-events-none z-50 whitespace-nowrap flex items-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4 text-[#009688]"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { auth, db, doc, getDoc, signOut, onAuthStateChanged, collection, addDoc, query, where, getDocs, deleteDoc } from './assets/js/firebase-config.js';

        // --- STATE ---
        let currentDoctorId = null;
        let pendingAction = null; 
        let existingTimeOff = []; 

        // --- DOM ELEMENTS ---
        const doctorNameEl = document.getElementById('doctor-name');
        const calendarContainer = document.getElementById('calendar-container');
        const modal = document.getElementById('confirm-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const confirmBtn = document.getElementById('confirm-btn');

        // --- 1. INITIALIZATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentDoctorId = user.uid;
                await loadDoctorProfile(user.uid);
                await refreshCalendar(); 
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadDoctorProfile(uid) {
            try {
                const docRef = await getDoc(doc(db, "Users", uid));
                if (docRef.exists()) {
                    const data = docRef.data();
                    let name = data.doctorName || data.name || data.fullName || "Doctor";
                    if (!name.toLowerCase().startsWith('dr') && name !== "Doctor") {
                        name = `Dr. ${name}`;
                    }
                    doctorNameEl.textContent = name;
                } else {
                    doctorNameEl.textContent = "Dr. Unknown";
                }
            } catch (e) { 
                console.error("Error fetching doctor profile:", e); 
                doctorNameEl.textContent = "Error Loading Name";
            }
        }

        window.handleLogout = async () => {
            await signOut(auth);
            window.location.href = "index.html";
        };

        // --- 2. CALENDAR RENDERING ---
        
        async function refreshCalendar() {
            // Teal Spinner
            calendarContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-40"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#009688]"></div><p class="text-xs text-gray-400 mt-2">Syncing Schedule...</p></div>';
            
            existingTimeOff = await fetchTimeOff(currentDoctorId);

            calendarContainer.innerHTML = ''; 
            const today = new Date();
            // Create a date object for "Today" with time stripped for accurate comparison
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            for (let i = 0; i < 3; i++) {
                // Get the first day of the month we are generating
                const currentMonthDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                
                const monthName = monthNames[currentMonthDate.getMonth()];
                const year = currentMonthDate.getFullYear();
                const monthIndex = currentMonthDate.getMonth(); // 0-11
                
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-6";
                // Teal Icon in Month Header
                card.innerHTML = `<h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-[#009688]"></i> ${monthName} ${year}</h3>`;
                
                const daysRow = document.createElement('div');
                daysRow.className = "grid grid-cols-7 text-center mb-3 border-b border-gray-100 pb-2";
                ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(d => {
                    daysRow.innerHTML += `<span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">${d}</span>`;
                });
                card.appendChild(daysRow);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-7 gap-y-3 justify-items-center";

                const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
                const startDay = new Date(year, monthIndex, 1).getDay();

                // Add empty slots for days before the 1st of the month
                for(let k=0; k<startDay; k++) grid.appendChild(document.createElement('div'));

                for(let d=1; d<=daysInMonth; d++) {
                    const btn = document.createElement('div');
                    const dateStr = `${d} ${monthName} ${year}`;
                    
                    // Create a specific Date object for this cell to compare with Today
                    const cellDate = new Date(year, monthIndex, d);

                    // LOGIC CHECK: Is this date in the past?
                    if (cellDate < todayStart) {
                        // --- PAST DATE ---
                        // Grayed out, reduced opacity, no cursor pointer, no onclick
                        btn.className = "w-9 h-9 flex items-center justify-center rounded-full text-sm font-bold text-gray-300 bg-gray-50 cursor-not-allowed border border-transparent";
                        btn.textContent = d;
                        // We do NOT add an onclick handler here
                    } else {
                        // --- TODAY OR FUTURE ---
                        const isUnavailable = existingTimeOff.includes(dateStr);

                        if (isUnavailable) {
                            // Red for Unavailable (Blocked)
                            btn.className = "w-9 h-9 flex items-center justify-center rounded-full text-sm font-bold cursor-pointer transition-all bg-red-50 text-red-500 border border-red-200 shadow-sm";
                        } else {
                            // Interactive Teal Hover for Available
                            btn.className = "w-9 h-9 flex items-center justify-center rounded-full text-sm font-bold cursor-pointer transition-all text-gray-700 hover:bg-[#e0f2f1] hover:text-[#009688] hover:border-[#009688] border border-transparent";
                        }
                        
                        btn.textContent = d;
                        btn.onclick = () => openModal(dateStr, isUnavailable);
                    }
                    
                    grid.appendChild(btn);
                }
                card.appendChild(grid);
                calendarContainer.appendChild(card);
            }
            lucide.createIcons();
        }
        // --- 3. MODAL & LOGIC ---

        window.openModal = (dateStr, isCurrentlyUnavailable) => {
            pendingAction = { dateStr, isCurrentlyUnavailable };

            if (isCurrentlyUnavailable) {
                // Changing from Unavailable -> Available
                modalTitle.innerText = "Mark as Available?";
                modalTitle.className = "text-lg font-bold text-gray-900 text-center mb-2";
                modalDesc.innerText = `Do you want to open up ${dateStr} for bookings?`;
                confirmBtn.innerText = "Yes, Make Available";
                // Green Button
                confirmBtn.className = "py-3 rounded-xl font-bold text-white bg-[#009688] hover:bg-[#00796b] shadow-lg shadow-teal-200 transition-colors";
            } else {
                // Changing from Available -> Unavailable
                modalTitle.innerText = "Mark as Unavailable?";
                modalTitle.className = "text-lg font-bold text-red-600 text-center mb-2";
                modalDesc.innerText = `Do you want to block ${dateStr} from your schedule?`;
                confirmBtn.innerText = "Yes, Block Date";
                // Red Button
                confirmBtn.className = "py-3 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 shadow-lg shadow-red-200 transition-colors";
            }

            modal.classList.remove('modal-enter');
            modal.classList.add('modal-active');
        };

        window.closeModal = () => {
            modal.classList.remove('modal-active');
            modal.classList.add('modal-enter');
            pendingAction = null;
        };

        confirmBtn.addEventListener('click', async () => {
            if (!pendingAction) return;

            const { dateStr, isCurrentlyUnavailable } = pendingAction;
            
            const originalBtnText = confirmBtn.innerText;
            confirmBtn.innerText = "Processing...";
            confirmBtn.disabled = true;

            try {
                if (isCurrentlyUnavailable) {
                    const q = query(collection(db, "TimeOff"), 
                        where("doctorId", "==", currentDoctorId),
                        where("date", "==", dateStr)
                    );
                    const snapshot = await getDocs(q);
                    const deletePromises = snapshot.docs.map(d => deleteDoc(d.ref));
                    await Promise.all(deletePromises);
                    showToast("Date marked as Available");
                } else {
                    await addDoc(collection(db, "TimeOff"), {
                        doctorId: currentDoctorId,
                        date: dateStr,
                        createdAt: new Date()
                    });
                    showToast("Date marked as Unavailable");
                }
                
                closeModal();
                await refreshCalendar(); 

            } catch (error) {
                console.error("FIREBASE ERROR:", error);
                alert("Error updating schedule: " + error.message);
                closeModal();
            } finally {
                confirmBtn.innerText = originalBtnText;
                confirmBtn.disabled = false;
            }
        });

        // --- 4. FIREBASE HELPERS ---

        async function fetchTimeOff(doctorId) {
            const list = [];
            try {
                const q = query(collection(db, "TimeOff"), where("doctorId", "==", doctorId));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    list.push(doc.data().date);
                });
            } catch (e) {
                console.error("Error fetching time off:", e);
            }
            return list;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            const txt = document.getElementById('toast-msg');
            txt.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

    </script>
</body>
</html>
